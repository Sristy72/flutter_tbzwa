name: flutter_tbzwa
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  get: ^4.7.3
  
  # UI
  flutx_core: ^1.1.1+1
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  flutter_svg: ^2.2.3
  record: ^6.2.1
  path_provider: ^2.1.2
  path: ^1.9.0
  audioplayers: ^6.7.1
  pinput: ^5.0.0

  # Network
  dio: ^5.9.1
  dartz: ^0.10.1
  equatable: ^2.0.8
  cached_network_image: ^3.4.1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0
  connectivity_plus: 6.0.5
  json_annotation: ^4.11.0
  socket_io_client: ^3.1.4
  visibility_detector: ^0.4.0+2
  video_player: ^2.11.1
  chewie: ^1.13.0
  photo_view: ^0.15.0
  intl: ^0.20.2
  flutter_webrtc: ^1.4.1
  permission_handler: ^11.0.1

  graphql_flutter: ^5.3.0
  flutter_cache_manager: ^3.4.1
  device_info_plus: 10.1.2
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  camera: ^0.12.0+1
  url_launcher: ^6.3.0

dependency_overrides:
  connectivity_plus: 6.0.5
  device_info_plus: 10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  json_serializable: ^6.13.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash_2.mp4
    - assets/images/
    - assets/icons/
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: Outfit Pro
      fonts:
        - asset: assets/font/Outfit-VariableFont_wght.ttf
          weight: 700
